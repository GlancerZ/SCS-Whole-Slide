[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "scs-whole-slide"
version = "0.1.0"
description = "One-model whole-slide SCS training with PyTorch, Muon, AMP, and SDPA"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "torch>=2.13,<2.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["optimizations*"]
namespaces = true
